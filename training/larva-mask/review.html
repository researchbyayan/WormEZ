<!doctype html><html lang="en"><meta charset="utf-8"><title>Larva mask review</title><link rel="stylesheet" href="../../dist-ui/wormez-ui.css"><style>:root{--accent:#3f6b4f;--ink:#263a2c;--ink-soft:#657068;--panel:#fff;--rule:#d3d9cf}.reference-editor{width:min(1000px,94vw);border:1px solid #d3d9cf;border-radius:18px;padding:18px}.reference-editor button[aria-pressed="true"]{background:#3f6b4f;color:#fff}body{font:14px system-ui;background:#f6f6f0;color:#263a2c;margin:30px}main{max-width:900px;margin:auto}button{padding:8px 14px;margin:5px;border:1px solid #b6c5b7;border-radius:16px;background:white;color:inherit}#preview{max-width:100%;max-height:50vh;image-rendering:auto;background:#111;border-radius:12px}#status{line-height:1.6}label{display:block;margin:14px 0}button:disabled{opacity:.4}</style><main><h1>Review larva masks</h1><p>Outline only the visible body. Exclude reflections, shadows and the display glow. Crops are suggestions, not labels. Mark unclear or incorrect crops as skipped.</p><label id="folderHint" hidden>Select the prepared frames folder once to edit masks offline: <input id="imageFolder" type="file" webkitdirectory></label><p id="status"></p><img id="preview" alt="Current unlabelled larva crop"><div><button id="back">Previous</button><button id="edit">Draw or edit mask</button><button id="skip">Skip unclear crop</button><button id="next">Next</button></div><label><input id="checked" type="checkbox"> I inspected the complete visible border of this mask.</label><button id="approve" disabled>Approve mask</button><button id="download">Download reviewed labels</button><label>Restore reviewed labels <input id="restore" type="file" accept="application/json"></label><p id="message" role="status"></p></main><script src="../../lib/selection.js"></script><script src="../../lib/selection-editor.js"></script><script src="manifest.js"></script><script>
'use strict';const $=id=>document.getElementById(id),items=LarvaManifest.frames;let index=0,draft=null,labels={},imageFiles=new Map(),previewBlob=null;try{labels=JSON.parse(localStorage.getItem('wormez-mask-labels')||'{}')}catch{}
function save(){try{localStorage.setItem('wormez-mask-labels',JSON.stringify(labels))}catch{$('message').textContent='Browser storage is full. Download the reviewed labels now to keep your progress.'}}
function show(){const f=items[index];draft=labels[f.id]?.mask||null;$('checked').checked=false;$('approve').disabled=true;if(previewBlob)URL.revokeObjectURL(previewBlob);previewBlob=imageFiles.has(f.image.split('/').pop())?URL.createObjectURL(imageFiles.get(f.image.split('/').pop())):null;$('preview').src=previewBlob||f.image;$('status').textContent=`${index+1} / ${items.length} · ${f.clip} · Frame ${f.frame} · ${f.split} · ${labels[f.id]?.reviewed?'Approved':labels[f.id]?.skipped?'Skipped':'Needs review'} · ${Object.values(labels).filter(l=>l.reviewed).length} masks approved`;$('back').disabled=index===0;$('next').disabled=index===items.length-1}
$('back').onclick=()=>{index--;show()};$('next').onclick=()=>{index++;show()};$('checked').onchange=()=>{$('approve').disabled=!draft||!$('checked').checked};
$('folderHint').hidden=location.protocol!=='file:';$('imageFolder').onchange=()=>{imageFiles=new Map([...$('imageFolder').files].map(f=>[f.name,f]));show()};
$('edit').onclick=async()=>{if(location.protocol==='file:'&&!previewBlob){$('message').textContent='Select the frames folder above once. Browser file security otherwise prevents editing these images.';return;}const image=$('preview');await image.decode();const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);WormAreaEditor.open({image:ctx.getImageData(0,0,c.width,c.height),initial:draft,onSave:mask=>{draft=mask;$('checked').checked=false;$('approve').disabled=true;$('message').textContent=`Mask contains ${mask.areaPixels} source pixels. Inspect it, then explicitly approve.`}});const dialog=document.querySelector('.reference-editor');dialog.querySelector('h2').textContent='Outline the larva';dialog.querySelector('[data-action=save]').textContent='Save mask';dialog.querySelector('header p').textContent='Select the visible body, excluding its shadow and glow. Save the mask, then explicitly approve it.';const canvas=dialog.querySelector('canvas');canvas.style.width=Math.min(720,image.naturalWidth*4)+'px';canvas.style.maxWidth='100%';canvas.style.imageRendering='pixelated';};
$('approve').onclick=()=>{if(!draft||!$('checked').checked)return;const f=items[index];labels[f.id]={id:f.id,clip:f.clip,frame:f.frame,reviewed:true,mask:draft};save();if(index<items.length-1)index++;show()};
$('skip').onclick=()=>{const f=items[index];labels[f.id]={id:f.id,clip:f.clip,frame:f.frame,skipped:true,reviewed:false};save();if(index<items.length-1)index++;show()};
$('download').onclick=()=>{const b=new Blob([JSON.stringify({schema:1,labels:Object.values(labels)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='larva-reviewed-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restore').onchange=async()=>{try{const j=JSON.parse(await $('restore').files[0].text());if(j.schema!==1||!Array.isArray(j.labels))throw Error('Invalid label file');for(const l of j.labels){const f=items.find(f=>f.id===l.id);if(!f||l.mask&&(l.mask.width!==f.width||l.mask.height!==f.height))throw Error('Mask does not match this frame');}labels=Object.fromEntries(j.labels.map(l=>[l.id,l]));save();show()}catch(e){$('message').textContent=e.message}};show();
</script></html>
